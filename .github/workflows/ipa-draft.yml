name: Release dry run draft (disabled)

# Future release-tag build. It runs the clean-Mac route of BUILDING.md from pinned tools
# and pinned inputs, checks it with --check, then runs the same release dry run the
# maintainer runs locally. It publishes nothing: no release, no upload, no signing.
# Keep the job disabled until docs/publishing.md "Enabling the CI draft" is done.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build after this draft is enabled
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    # Deliberately disabled even for manual dispatch. No signing secrets or uploads.
    if: ${{ false }}
    # Pinned image label, never macos-latest. Before enabling, confirm in the runner image
    # list that this label offers macOS 27.2 with Xcode 27.2 (27B52) at the path below;
    # scripts/setup_tools.py refuses any other Xcode.
    runs-on: macos-27
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SATCHEL_WORK: /Users/runner/SatchelClean
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      # actions/checkout v4.2.2, pinned by commit. Confirm the commit before enabling.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false
      - name: Clean-Mac route (pinned tools, pinned inputs, unsigned app and IPA)
        run: /usr/bin/python3 -B scripts/clean_build.py --work "$SATCHEL_WORK"
      - name: Every clean-route step passes
        run: /usr/bin/python3 -B scripts/clean_build.py --work "$SATCHEL_WORK" --check
      - name: Distribution contract and hygiene
        run: |
          "$SATCHEL_WORK/tools/bin/python3" -B NativeApp/Distribution/test_source.py
          "$SATCHEL_WORK/tools/bin/python3" -B NativeApp/Distribution/test_ipa.py
          "$SATCHEL_WORK/tools/bin/python3" -B NativeApp/Distribution/test_release.py
          sh scripts/check_repo_hygiene.sh
      - name: Release dry run (offline, writes only into the work folder)
        run: |
          "$SATCHEL_WORK/tools/bin/python3" -B scripts/release_dry_run.py \
            --clean-work "$SATCHEL_WORK" --out "$SATCHEL_WORK/release-dry-run" \
            --expect-tag "$RELEASE_TAG"
          cat "$SATCHEL_WORK/release-dry-run/release/SHA256SUMS"
      # No upload step. Keeping the dry-run folder as a workflow artifact, or attaching it
      # to a release, is a separate decision for the maintainer.
