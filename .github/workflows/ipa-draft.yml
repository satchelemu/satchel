name: Unsigned IPA draft (disabled)

# Future release-tag build. It follows the clean-Mac route of BUILDING.md. Keep it
# disabled until a hosted runner offers Xcode 27.2 and the route has passed there.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build after this draft is enabled
        required: true
        type: string

permissions:
  contents: read

jobs:
  ipa:
    # Deliberately disabled even for manual dispatch. No signing secrets or uploads.
    if: ${{ false }}
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      SATCHEL_WORK: /Users/runner/SatchelClean
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false
      - name: Pinned tools, pinned dependencies, unsigned Release app and IPA
        run: /usr/bin/python3 -B scripts/clean_build.py --work "$SATCHEL_WORK"
      - name: Verify ad hoc re-signing and the source
        run: |
          "$SATCHEL_WORK/tools/bin/python3" -B scripts/build_ipa.py --verify-resign "$SATCHEL_WORK/ipa/Satchel.ipa"
          "$SATCHEL_WORK/tools/bin/python3" -B NativeApp/Distribution/source.py generate "$SATCHEL_WORK/ipa/Satchel.ipa" --out "$SATCHEL_WORK/ipa"
          "$SATCHEL_WORK/tools/bin/python3" -B NativeApp/Distribution/source.py validate "$SATCHEL_WORK/ipa/source.json" "$SATCHEL_WORK/ipa/Satchel.ipa"
      - name: Distribution contract and hygiene
        run: |
          "$SATCHEL_WORK/tools/bin/python3" -B NativeApp/Distribution/test_source.py
          "$SATCHEL_WORK/tools/bin/python3" -B NativeApp/Distribution/test_ipa.py
          sh scripts/check_repo_hygiene.sh
