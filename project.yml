        HEADER_SEARCH_PATHS: ['$(SRCROOT)/Core', '$(SRCROOT)/Tools/CPUProbe', '$(SRCROOT)/Tools/ShaderBridge', '$(SRCROOT)/Tools/VulkanBackend', '$(SRCROOT)/Tools/GuestGraphics', '$(SRCROOT)/Tools/GuestVI', '$(SRCROOT)/Tools/HorizonIPC', '$(SRCROOT)/Tools/ScalarCompiler', '$(SRCROOT)/Tools/RasterCompiler']
