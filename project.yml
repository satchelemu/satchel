        CURRENT_PROJECT_VERSION: '8'
        GCC_OPTIMIZATION_LEVEL: '3'
        SWIFT_OPTIMIZATION_LEVEL: '-O'
        ENABLE_BITCODE: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Satchel
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
        UIRequiresFullScreen: YES
        UIFileSharingEnabled: YES
        LSSupportsOpeningDocumentsInPlace: YES
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.dell.satchel.nro
            UTTypeDescription: Nintendo Switch Homebrew
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nro]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
  SatchelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
        excludes: [Navigation]
    dependencies:
      - target: Satchel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dell.satchel.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Satchel
  SatchelNavigationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI/Navigation
        includes: ["*.swift"]
    dependencies:
      - target: Satchel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dell.satchel.satchelnavigationuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Satchel
schemes:
  SatchelNavigation:
    build:
      targets:
        Satchel: all
        SatchelNavigationUITests: [test]
    test:
      config: Release
      targets:
        - name: SatchelNavigationUITests
          parallelizable: false
  Satchel:
    build:
      targets:
        Satchel: all
        SatchelUITests: [test]
    test:
      config: Release
      targets: [SatchelUITests]
